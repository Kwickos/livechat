[package]
name = "livechat-overlay"
version = "0.2.9"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol : embarque l'UI dans le binaire, permet de compiler avec
# cargo directement, sans le CLI tauri.
tauri = { version = "2", features = ["tray-icon", "custom-protocol", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
# rustls-tls-webpki-roots : permet le wss:// avec des certificats racine embarqués.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# rustls 0.23 exige un fournisseur crypto explicite (sinon panique TLS en wss://).
rustls = { version = "0.23", features = ["ring"] }
toml = "0.8"
percent-encoding = "2"
