<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>LiveChat Overlay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage" class="pos-center">
    <div id="media-box">
      <img id="img" class="hidden" alt="" />
      <video id="video" class="hidden" playsinline></video>
      <audio id="audio" class="hidden"></audio>
      <div id="meta">
        <span id="sender"></span>
        <span id="caption"></span>
      </div>
    </div>
  </div>
  <div id="status"></div>
  <script src="main.js"></script>
</body>
</html>
