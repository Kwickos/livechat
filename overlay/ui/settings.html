<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>LiveChat — Paramètres</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main>
    <div class="title-row">
      <h1>Paramètres</h1>
      <span id="version" class="app-version"></span>
    </div>

    <section>
      <h2>Connexion</h2>
      <div class="connection-modes" role="radiogroup" aria-label="Mode de connexion">
        <label class="connection-mode">
          <input type="radio" name="connection-mode" value="self-host" checked />
          <span>
            <strong>Mon serveur</strong>
            <small>Adresse et mot de passe partagés</small>
          </span>
        </label>
        <label class="connection-mode">
          <input type="radio" name="connection-mode" value="hosted" />
          <span>
            <strong>LiveChat hébergé</strong>
            <small>Connexion avec Discord</small>
          </span>
        </label>
      </div>

      <div id="self-host-settings">
        <label for="server">Adresse du serveur</label>
        <input id="server" type="text" placeholder="wss://ton-domaine.example/ws" spellcheck="false" autocomplete="off" />
        <label for="secret">Mot de passe partagé</label>
        <div class="row">
          <input id="secret" type="password" spellcheck="false" autocomplete="off" />
          <button id="toggle-secret" type="button" title="Afficher / masquer">👁</button>
        </div>
      </div>

      <div id="hosted-settings" class="hosted-notice hidden">
        <button id="login-discord" type="button">Se connecter avec Discord</button>
        <span id="hosted-status">Connecte Discord pour afficher tes serveurs abonnés.</span>
        <label for="hosted-guild">Serveur Discord</label>
        <select id="hosted-guild" disabled>
          <option value="">Connecte Discord d'abord</option>
        </select>
      </div>
      <label class="check">
        <input id="autostart" type="checkbox" />
        Lancer automatiquement au démarrage de Windows
      </label>
    </section>

    <section>
      <h2>Affichage</h2>
      <label for="position">Position à l'écran</label>
      <select id="position">
        <option value="center">Centre</option>
        <option value="top-left">Haut gauche</option>
        <option value="top-right">Haut droite</option>
        <option value="bottom-left">Bas gauche</option>
        <option value="bottom-right">Bas droite</option>
      </select>

      <label for="max-size">Taille maximale <span class="val" id="size-val"></span></label>
      <input id="max-size" type="range" min="10" max="95" step="1" />

      <label for="display-seconds">Durée d'affichage des images <span class="val" id="imgsec-val"></span></label>
      <input id="display-seconds" type="range" min="1" max="60" step="1" />

      <label for="max-video-seconds">Durée max vidéos &amp; sons <span class="val" id="vidsec-val"></span></label>
      <input id="max-video-seconds" type="range" min="5" max="600" step="5" />

      <label for="volume">Volume <span class="val" id="volume-val"></span></label>
      <input id="volume" type="range" min="0" max="100" step="5" />

      <label>Icône</label>
      <div class="icon-picker" id="icon-picker">
        <label class="icon-choice">
          <input type="radio" name="icon-variant" value="color" />
          <img src="icons/color.svg" alt="" />
          <span>Couleur</span>
        </label>
        <label class="icon-choice">
          <input type="radio" name="icon-variant" value="dark" />
          <img src="icons/dark.svg" alt="" />
          <span>Noir</span>
        </label>
        <label class="icon-choice">
          <input type="radio" name="icon-variant" value="light" />
          <img src="icons/light.svg" alt="" />
          <span>Blanc</span>
        </label>
      </div>
    </section>

    <div id="restart-bar" class="hidden">
      <span>La connexion doit redémarrer pour appliquer ces changements.</span>
      <button id="restart-now" type="button">Redémarrer maintenant</button>
    </div>

    <div class="actions">
      <button id="save" class="primary" type="button">Enregistrer</button>
      <button id="test" type="button">Tester l'affichage</button>
      <span id="save-status"></span>
    </div>

    <footer>
      <button id="check-updates" class="link" type="button">Vérifier les mises à jour</button>
      <span id="update-status"></span>
    </footer>
  </main>
  <script src="settings.js"></script>
</body>
</html>
